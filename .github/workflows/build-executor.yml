# Build the CI job executor image → GHCR.
#
# ONE executor image: a Guix System OS + job toolchain (git, .NET, Python,
# guix, make, curl …). It is NOT a runner — no gitea-runner/act-runner
# binary inside. A CI system (Gitea Actions / Forgejo / GitHub) runs its
# runner process elsewhere and executes job steps inside this image, so
# there are no per-CI variants and no variant tags: one image, one tag.
#
# Substitute policy by runner class (this workflow is GitHub-hosted):
#   - GitHub-hosted runners have NO IPv6 egress and cache01 is AAAA-only,
#     so a private cache URL there is a connect-timeout per miss, not a
#     fast fallback (see substitute-cache-garage.md). Use official
#     substitutes only: ci.guix.gnu.org + bordeaux.
#   - Self-hosted runners on the fleet substitute cache01 first; the
#     GUIX_CACHE_URL secret carries that URL for workflows that run there.

name: build-executor

on:
  push:
    branches: [main]
    paths:
      - 'executor/**'
      - '.github/workflows/build-executor.yml'
  workflow_dispatch:  # manual trigger (version bumps, retries)

permissions:
  contents: read
  packages: write  # push to GHCR

env:
  # mkstemp: Permission denied fix — the guix-daemon (root) inherits TMPDIR
  # from the systemctl environment, which points at the runner-owned temp
  # dir (/home/runner/work/_temp, mode 0700, owned by runner user). Root can
  # traverse it but cannot create files there (no w+x for other). Setting
  # TMPDIR=/tmp at job level propagates to all steps AND to daemon commands
  # invoked via `systemctl set-environment` or `sudo systemctl` (the install
  # action's daemon unit does NOT pin TMPDIR, so it inherits this).
  TMPDIR: /tmp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          pullAfterInstall: true

      - name: Configure substitute URLs
        run: |
          # Ordered first-hit-wins, private cache FIRST then public mirrors —
          # the shape aigate's guix-toolchain action settled on. cache01 is
          # AAAA-only and a GH-hosted runner has no IPv6 egress, so a hit is
          # unlikely there; a miss falls through to the public mirrors instead
          # of failing (substitute-urls is consulted in sequence, Guix stops at
          # the first server that has the item). Cost when unreachable is one
          # DNS/connect timeout per item, not a job failure.
          # On a fleet self-hosted runner (with IPv6 via overlay) the private
          # cache DOES serve and this same list gives the speed win.
          PUBLIC_URLS="https://mirror.sjtu.edu.cn/guix/ https://ci.guix.gnu.org https://bordeaux.guix.gnu.org"
          if [ -n "${{ secrets.GUIX_CACHE_URL }}" ]; then
            SUBSTITUTE_URLS="${{ secrets.GUIX_CACHE_URL }} $PUBLIC_URLS"
            echo "substitute sources: private cache first, then public mirrors"
          else
            SUBSTITUTE_URLS="$PUBLIC_URLS"
            echo "substitute sources: public mirrors only (no GUIX_CACHE_URL secret)"
          fi
          # Write to a daemon drop-in: the install action has no
          # substitute-urls input, and the daemon (not this shell) fetches.
          # TMPDIR: root process in daemon cannot mkstemp in runner-owned
          # /home/runner/work/_temp (mode 0700) — pin /tmp here so daemon
          # inherits it regardless of caller env (mkstemp: Permission denied).
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          printf '[Service]\nEnvironment="GUIX_SUBSTITUTE_URLS=%s"\nEnvironment="TMPDIR=/tmp"\n' "$SUBSTITUTE_URLS" | \
            sudo tee /etc/systemd/system/guix-daemon.service.d/10-substitute.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon
          echo "substitute-urls = $SUBSTITUTE_URLS"

          # PromyLOPh action installs guix under root's profile but does NOT
          # put it on the runner's PATH for subsequent steps. GITHUB_PATH is
          # the official mechanism — same pattern aigate uses (line 166).
          echo "/var/guix/profiles/per-user/root/current-guix/bin" >> "$GITHUB_PATH"
          echo "guix path added to GITHUB_PATH for subsequent steps"

      - name: Diagnose guix environment
        run: |
          # Evidence for the NEXT failure, not a guess: where guix actually is,
          # what PATH looks like, and whether GITHUB_PATH from the prior step
          # landed (this is what would have saved two debug cycles already).
          echo "which guix: $(command -v guix || echo NOT-IN-PATH)"
          echo "GITHUB_PATH (prior step writes): $GITHUB_PATH"
          echo "PATH entries containing guix:"
          echo "$PATH" | tr ':' '\n' | grep -i guix || echo "  (none)"
          ls -d /var/guix/profiles/per-user/root/current-guix/bin/guix 2>/dev/null \
            && echo "root-profile guix: PRESENT" || echo "root-profile guix: MISSING"

      - name: Build executor image (docker format)
        run: |
          # OFFICIAL MANUAL (guix time-machine): the command after `--` is a
          # bare SUBCOMMAND name, never `guix <subcommand>` —
          #   guix time-machine --commit=v1.2.0 -- environment -C --ad-hoc guile
          # `guix` there resolves only on the runner PATH, which is why runs
          # 8-10 died with `guix: command not found` (the extra `guix` word).
          # `-C .guix/channels.scm` still supplies official + nonguix, so
          # `dotnet` resolves at build time.
          #
          # run12 PROVED the build itself works (step green) — but
          # `> /tmp/executor.tar.gz` captured only 64 bytes: `guix system
          # image` WRITES THE IMAGE INTO /gnu/store and prints a one-line
          # store PATH on stdout (verified against guix 1.5.0's image.scm and
          # a local `--dry-run`: stdout is empty until the real store path is
          # emitted). So: capture that path, then locate the real docker
          # tarball inside the store item.
          # SUBSTITUTE_URLS at BOTH layers (aigate guix-drift shape):
          # time-machine resolves channels AND the inner `system image`
          # resolves packages — each consults substitutes independently, so
          # a URL on only one layer leaves the other on daemon defaults.
          SUBS="${{ secrets.GUIX_CACHE_URL }} https://mirror.sjtu.edu.cn/guix/ https://ci.guix.gnu.org https://bordeaux.guix.gnu.org"
          # substitute-urls on time-machine layer only; inner `system image`
          # inherits daemon config (cache01 + SJTU + official in drop-in).
          # stderr/stdout MUST be split: with `2>&1 | tail -1` the multi-line
          # guix error collapsed into a single line, was captured as STORE_PATH,
          # and the `[ -n ]` guard saw it as non-empty — hiding the real
          # `.drv` build failure entirely (run 38700585418).
          # Now: stdout (the store path) is captured; stderr streams to the log.
          set +e
          STORE_PATH=$(guix time-machine -C .guix/channels.scm \
            --substitute-urls="$SUBS" -- \
            system image -t docker \
            executor/gitea/config.scm 2> >(tee /tmp/guix-build-stderr.log >&2) \
            | tail -1)
          GUIX_RC=${PIPESTATUS[0]}
          set -e
          echo "STORE_PATH='$STORE_PATH' (rc=$GUIX_RC)"
          if [ "$GUIX_RC" -ne 0 ] || [ -z "$STORE_PATH" ]; then
            echo "=== BUILD FAILED (rc=$GUIX_RC) — full guix stderr ==="
            cat /tmp/guix-build-stderr.log
            exit 1
          fi
          echo "store path: $STORE_PATH"
          # The store item IS the gzipped docker tarball — a plain FILE
          #   /gnu/store/<hash>-docker-image.tar.gz  (~630 MB; verified as
          #   the real item shape on the fleet builder, alongside its .drv).
          # No find needed: searching a file returns nothing (that was run
          # 13's FATAL). Validate the path is the file itself.
          [ -f "$STORE_PATH" ] || { echo "FATAL: store path is not a file: '$STORE_PATH'"; exit 1; }
          case "$STORE_PATH" in
            *.tar.gz) : ;;
            *) echo "FATAL: unexpected store item name: $STORE_PATH";
             cat /tmp/guix-build-stderr.log; exit 1 ;;
          esac
          cp "$STORE_PATH" /tmp/executor.tar.gz
          ls -lh /tmp/executor.tar.gz

      - name: Inject POSIX /bin for container runtimes
        # Guix's `docker` image type writes /bin (directory only) at BUILD time
        # and defers every service-time symlink (activation,
        # special-files-service-type) to boot — but a CI runner's `docker create
        # --entrypoint tail` never boots the Guix system, so the runner died with
        # `exec: "tail": executable file not found in $PATH`.
        #
        # Guix exposes no build-time hook to inject these links (verified in
        # source: `extras` exists in populate-root-file-system but is not plumbed
        # to the operating-system record). So we extend the image layer itself:
        # same store paths Guix already carries — only the /bin view changes.
        run: |
          set -e
          podman load < /tmp/executor.tar.gz
          mkdir -p /tmp/binlayer/bin
          # Boot the image's own entrypoint (needed because /run/current-system
          # is created by activation AT BOOT), then resolve each tool's store
          # path inside — so links point at what this exact build shipped.
          podman run -d --name resolve-tools localhost/guix:latest
          for i in $(seq 1 30); do
            podman exec resolve-tools /run/current-system/profile/bin/ls /bin >/dev/null 2>&1 && break
            sleep 2
          done
          podman exec resolve-tools /run/current-system/profile/bin/sh \
            -c 'for t in sh bash tail head cat ls env sleep cut sort uniq wc tee
                     mkdir rm cp mv ln chmod chown echo printf true false
                     grep sed awk gawk find xargs tar gzip which; do
                  p=$(command -v "$t" 2>/dev/null || true)
                  [ -n "$p" ] && printf "%s %s\n" "$t" "$p"
                done' > /tmp/binlayer/map.txt
          podman stop resolve-tools && podman rm resolve-tools
          echo "=== tools resolved from image ==="
          cat /tmp/binlayer/map.txt
          wc -l < /tmp/binlayer/map.txt
          # Build the new layer: /bin/<tool> -> <store path> symlinks.
          while read -r name path; do
            ln -sf "$path" "/tmp/binlayer/bin/$name"
          done < /tmp/binlayer/map.txt
          # Append the layer to the existing docker-archive (last layer wins).
          podman build -t localhost/guix:latest -f - /tmp/binlayer <<'DOCKERFILE'
          FROM localhost/guix:latest
          COPY bin /bin
          DOCKERFILE
          podman save -o /tmp/executor-patched.tar.gz localhost/guix:latest
          mv /tmp/executor-patched.tar.gz /tmp/executor.tar.gz
          ls -lh /tmp/executor.tar.gz

      - name: Verify image
        run: |
          ls -lh /tmp/executor.tar.gz
          gzip -t /tmp/executor.tar.gz
          podman load < /tmp/executor.tar.gz
          # Sanity: the injected links must resolve to real store paths.
          podman run --rm --entrypoint /bin/sh localhost/guix:latest -c \
            'for t in sh bash tail head cat grep sed awk find; do
               printf "%-6s -> %s\n" "$t" "$(readlink /bin/$t)"
               "/bin/$t" --version >/dev/null 2>&1 || "/bin/$t" -V >/dev/null 2>&1 || true
             done'
          # GitHub Actions container protocol: the runner boots the container
          # with --entrypoint tail -f /dev/null, then execs steps inside.
          # Emulate that exact contract here.
          podman run -d --name exec-smoke --entrypoint tail localhost/guix:latest -f /dev/null
          podman exec exec-smoke /run/current-system/profile/bin/guix --version
          podman exec exec-smoke /run/current-system/profile/bin/python3 --version
          podman exec exec-smoke /run/current-system/profile/bin/dotnet --version
          podman exec exec-smoke /run/current-system/profile/bin/git --version
          podman exec exec-smoke /bin/sh -c 'echo "POSIX layer OK"'
          podman stop exec-smoke && podman rm exec-smoke

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          SRC="localhost/guix:latest"
          # OCI requires ALL-LOWERCASE repository paths; the GitHub owner
          # (Zhen-LinHuo) carries capitals and is rejected verbatim by
          # `podman push` with "repository name must be lowercase".
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          DEST="ghcr.io/${OWNER}/reproducible-executors/executor-guixsd"
          VERSION="$(cat executor/gitea/VERSION)"
          # Three-tag policy: v-semver (explicit content version, bumped by
          # editing VERSION), latest (points at the newest vX.Y.Z), and a
          # sha tag for build traceability. No per-CI variants.
          podman tag "$SRC" "$DEST:v${VERSION}"
          podman tag "$SRC" "$DEST:latest"
          podman tag "$SRC" "$DEST:sha-${GITHUB_SHA:0:12}"
          podman push "$DEST:v${VERSION}"
          podman push "$DEST:latest"
          podman push "$DEST:sha-${GITHUB_SHA:0:12}"

      - name: Image metadata
        run: |
          podman inspect "ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/reproducible-executors/executor-guixsd:latest" \
            --format '{{.Size}} bytes'
